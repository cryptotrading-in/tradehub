name: Tradehub Wallet D1 Audit

on:
  push:
    branches:
      - cleanup/wallet-hero-and-diagnostic
  workflow_dispatch:

jobs:
  wallet-audit:
    name: Read-only wallet transaction audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 whoami

      - name: Audit wallet transaction duplicates (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo '=== ROUND_PROFIT rows ==='
          npx --yes wrangler@4.131.1 d1 execute tradehub-db --remote --command "SELECT id,user_id,trade_id,type,amount,balance_after,status,created_at FROM wallet_transactions WHERE type='ROUND_PROFIT' ORDER BY created_at DESC LIMIT 100"
          echo '=== Duplicate ROUND_PROFIT by trade_id ==='
          npx --yes wrangler@4.131.1 d1 execute tradehub-db --remote --command "SELECT trade_id,COUNT(*) AS row_count,GROUP_CONCAT(id) AS transaction_ids,SUM(amount) AS total_amount FROM wallet_transactions WHERE type='ROUND_PROFIT' AND trade_id IS NOT NULL GROUP BY trade_id HAVING COUNT(*)>1 ORDER BY MAX(created_at) DESC"
          echo '=== ROUND_PROFIT totals ==='
          npx --yes wrangler@4.131.1 d1 execute tradehub-db --remote --command "SELECT COUNT(*) AS round_profit_rows,COUNT(DISTINCT trade_id) AS distinct_trade_ids,COALESCE(SUM(amount),0) AS total_round_profit FROM wallet_transactions WHERE type='ROUND_PROFIT'"
          echo 'AUDIT COMPLETE: read-only queries only'
