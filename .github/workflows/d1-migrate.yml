name: Tradehub D1 Migration

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Apply pending D1 migrations to the production database'
        required: true
        type: choice
        options:
          - APPLY

jobs:
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 whoami

      - name: Direct D1 API diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADEHUB_D1_DATABASE_ID: 1c0f1bbe-16ba-4176-8175-cce9d54c2b8b
        run: |
          set -o pipefail
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${TRADEHUB_D1_DATABASE_ID}/query" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data '{"sql":"SELECT 1 AS connected"}')
          echo "$response"
          status=$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS://p')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Direct Cloudflare D1 API request failed with HTTP status $status."
            exit 1
          fi

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 d1 migrations apply tradehub-db --remote

      - name: Verify production API
        run: |
          set -e
          response=$(curl -fsS https://tradehub.earnybycrypto.workers.dev/api/health)
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"database":true'
          echo "$response" | grep -q '"sessions":true'
          echo "$response" | grep -q '"users":true'
          echo "D1 migration and API verification passed."
