name: Tradehub Wallet Balance Audit

on:
  push:
    branches:
      - cleanup/wallet-hero-and-diagnostic
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 whoami
      - name: Read wallet funding and ledger state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.1 d1 execute tradehub-db --remote --command "SELECT id,user_id,amount,status,created_at,reviewed_at FROM deposit_requests ORDER BY created_at"
          npx --yes wrangler@4.131.1 d1 execute tradehub-db --remote --command "SELECT id,user_id,deposit_id,amount,balance_after,status,created_at FROM wallet_deposit_transactions ORDER BY created_at"
          npx --yes wrangler@4.131.1 d1 execute tradehub-db --remote --command "SELECT id,user_id,reference_id,type,amount,balance_after,status,created_at FROM wallet_activity ORDER BY created_at"
          echo 'BALANCE AUDIT COMPLETE: read-only queries only'
