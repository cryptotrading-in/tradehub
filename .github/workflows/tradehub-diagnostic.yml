name: Tradehub Production Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Run production diagnostic and apply pending D1 migrations'
        required: true
        type: choice
        options:
          - RUN

jobs:
  diagnostic:
    name: Diagnose Tradehub production
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 whoami

      - name: D1 connectivity diagnostic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADEHUB_D1_DATABASE_ID: 1c0f1bbe-16ba-4176-8175-cce9d54c2b8b
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\nHTTP_STATUS:%{http_code}' \
            -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${TRADEHUB_D1_DATABASE_ID}/query" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data '{"sql":"SELECT 1 AS connected"}')
          echo "$response"
          status=$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS://p')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "FAIL: D1 API returned HTTP $status"
            exit 1
          fi
          echo "PASS: D1 API connection"

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 d1 migrations apply tradehub-db --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.131.1 deploy

      - name: Verify production health
        run: |
          set -euo pipefail
          response=$(curl -fsS --retry 5 --retry-delay 3 https://tradehub.earnybycrypto.workers.dev/api/health)
          echo "$response"
          echo "$response" | grep -q '"ok":true'
          echo "$response" | grep -q '"database":true'
          echo "$response" | grep -q '"sessions":true'
          echo "$response" | grep -q '"users":true'
          echo "PASS: production health"

      - name: Final result
        run: echo 'TRADEHUB PRODUCTION DIAGNOSTIC: PASS'
