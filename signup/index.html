<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />
  <title>Create Account — Tradehub</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,rgba(124,108,255,.16),transparent 42%),#080b12}
    .auth-card{width:min(100%,520px);padding:28px}
    .auth-card h1{margin:6px 0 8px}
    .auth-card p{color:#9ba5b7}
    .auth-form{display:grid;gap:14px;margin-top:22px}
    .auth-form label{display:grid;gap:7px;font-size:13px;color:#cbd2df}
    .auth-form input{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.1);background:#141925;color:#f5f7fb;border-radius:12px;padding:12px 13px;font:inherit;outline:none}
    .auth-form input:focus{border-color:#7c6cff;box-shadow:0 0 0 3px rgba(124,108,255,.12)}
    .terms{display:flex!important;grid-template-columns:auto 1fr;display:grid!important;grid-template-columns:18px 1fr;align-items:start;gap:9px!important}
    .terms input{width:16px;height:16px;margin-top:2px}
    .auth-button{border:0;border-radius:12px;padding:13px 16px;background:#7c6cff;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    .auth-button:disabled{opacity:.6;cursor:wait}
    .auth-message{min-height:20px;font-size:13px;margin:0!important}
    .auth-message.error{color:#ff7a88}.auth-message.success{color:#29c98a}
    .auth-footer{text-align:center;margin-top:18px;font-size:14px}
    .auth-footer a{color:#9a8fff;text-decoration:none}
  </style>
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card glass-card" aria-labelledby="signup-title">
      <span class="label">TRADEHUB</span>
      <h1 id="signup-title">Create your account</h1>
      <p>Set up your secure Tradehub account to get started.</p>

      <form id="signup-form" class="auth-form" novalidate>
        <label>Full Name<input name="fullName" autocomplete="name" required maxlength="100" /></label>
        <label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" /></label>
        <label>Email Address<input name="email" type="email" autocomplete="email" required maxlength="254" /></label>
        <label>Phone Number<input name="phone" type="tel" autocomplete="tel" required maxlength="30" /></label>
        <label>Password<input name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" /></label>
        <label>Confirm Password<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" /></label>
        <label>Recovery PIN<input name="recoveryPin" type="password" inputmode="numeric" autocomplete="off" required pattern="[0-9]{4,12}" minlength="4" maxlength="12" /></label>
        <label class="terms"><input name="termsAccepted" type="checkbox" required /><span>I agree to the Tradehub Terms &amp; Conditions.</span></label>
        <p id="signup-message" class="auth-message" aria-live="polite"></p>
        <button id="signup-submit" class="auth-button" type="submit">Create Account</button>
      </form>

      <div class="auth-footer">Already have an account? <a href="/signin/">Sign In</a></div>
    </section>
  </main>
<script>
(() => {
  const form = document.getElementById('signup-form');
  const button = document.getElementById('signup-submit');
  const message = document.getElementById('signup-message');

  form.addEventListener('submit', async event => {
    event.preventDefault();
    message.className = 'auth-message';
    message.textContent = '';

    if (!form.reportValidity()) return;

    const data = Object.fromEntries(new FormData(form).entries());
    data.termsAccepted = form.elements.termsAccepted.checked;

    if (data.password !== data.confirmPassword) {
      message.className = 'auth-message error';
      message.textContent = 'Passwords do not match.';
      return;
    }

    button.disabled = true;
    button.textContent = 'Creating Account...';

    try {
      const response = await fetch('/api/auth/signup', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.error || 'Unable to create account.');
      }

      message.className = 'auth-message success';
      message.textContent = 'Account created successfully. Redirecting...';
      setTimeout(() => { window.location.href = '/'; }, 700);
    } catch (error) {
      message.className = 'auth-message error';
      message.textContent = error.message || 'Something went wrong.';
      button.disabled = false;
      button.textContent = 'Create Account';
    }
  });
})();
</script>
</body>
</html>
