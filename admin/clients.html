<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradehub · Clients</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    html.auth-check body{visibility:hidden}
    .wrap{max-width:1100px;margin:30px auto;padding:20px}
    .search{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff08;color:inherit;outline:none;margin-top:14px}
    .table-wrap{margin-top:20px;overflow-x:auto;border:1px solid #ffffff12;border-radius:12px}
    .clients-table{width:100%;border-collapse:collapse;min-width:760px}
    .clients-table th,.clients-table td{padding:13px 14px;text-align:left;border-bottom:1px solid #ffffff10}
    .clients-table th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
    .clients-table tr:last-child td{border-bottom:0}
    .client-id{display:inline-flex;align-items:center;gap:7px}
    .copy-btn{padding:5px 8px;border:1px solid #ffffff22;border-radius:7px;background:#ffffff08;color:inherit;cursor:pointer;font-size:12px}
    .status{font-size:12px}
    .empty{opacity:.7;padding:20px;text-align:center}
    @media(max-width:720px){.wrap{margin:12px auto;padding:12px}.clients-table{min-width:700px}}
  </style>
  <script>document.documentElement.classList.add('auth-check');fetch('/api/admin/session').then(r=>r.json()).then(s=>{if(!s.authenticated||s.session?.role!=='admin')location.replace('/admin/login.html');else document.documentElement.classList.remove('auth-check')}).catch(()=>location.replace('/admin/login.html'));</script>
</head>
<body class="shell-page">
  <main class="wrap">
    <section class="glass-card" style="padding:22px">
      <span class="label">TRADEHUB · CLIENTS</span>
      <h1>Registered Clients</h1>
      <input class="search" id="search" type="search" placeholder="Search clients by name, client ID, email or phone..." autocomplete="off" />
      <div class="table-wrap">
        <table class="clients-table">
          <thead><tr><th>Name</th><th>Client ID</th><th>Email</th><th>Phone Number</th><th>Account Status</th></tr></thead>
          <tbody id="clients"><tr><td colspan="5" class="empty">Loading clients…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
<script>
let clients=[];
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderClients(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const rows=clients.filter(x=>[x.full_name,x.id,x.email,x.phone].some(v=>String(v??'').toLowerCase().includes(q)));
  document.getElementById('clients').innerHTML=rows.map(x=>`<tr><td>${escapeHtml(x.full_name)}</td><td><span class="client-id"><span>${escapeHtml(x.id)}</span><button class="copy-btn" type="button" onclick="copyClientId('${escapeHtml(x.id)}',this)">Copy</button></span></td><td>${escapeHtml(x.email)}</td><td>${escapeHtml(x.phone)}</td><td><span class="status">${escapeHtml(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No matching clients found.</td></tr>';
}
async function copyClientId(id,btn){try{await navigator.clipboard.writeText(id);const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=old,1200)}catch{}}
async function loadClients(){
  try{const r=await fetch('/api/admin/clients');const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load clients');clients=d.clients||[];renderClients()}
  catch(e){document.getElementById('clients').innerHTML=`<tr><td colspan="5" class="empty">${escapeHtml(e.message||'Unable to load clients')}</td></tr>`}
}
document.getElementById('search').addEventListener('input',renderClients);
loadClients();
</script>
</body>
</html>
