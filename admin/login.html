<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradehub · Admin Login</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(440px,100%);padding:28px}.auth-card h1{margin:.25rem 0 .5rem}.auth-card form{display:grid;gap:12px;margin-top:20px}.auth-card input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff08;color:inherit}.auth-card button{padding:12px;border:0;border-radius:10px;cursor:pointer}.link{background:none!important;color:inherit;text-decoration:underline;padding:4px!important}.msg{min-height:20px;font-size:.9rem}</style>
</head>
<body class="shell-page">
  <main class="glass-card auth-card">
    <span class="label">TRADEHUB · ADMIN</span>
    <h1>Admin Login</h1>
    <p id="intro">Sign in to the Tradehub Control Center.</p>
    <form id="loginForm">
      <input name="identifier" placeholder="Email or username" autocomplete="username" required />
      <input name="password" type="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Sign In</button>
      <button class="link" type="button" id="forgotBtn">Forgot password?</button>
      <div class="msg" id="msg"></div>
    </form>
    <form id="forgotForm" hidden>
      <input name="identifier" placeholder="Admin email or username" required />
      <input name="recoveryPin" inputmode="numeric" placeholder="Recovery PIN" required />
      <input name="newPassword" type="password" placeholder="New password" autocomplete="new-password" required />
      <input name="confirmNewPassword" type="password" placeholder="Confirm new password" autocomplete="new-password" required />
      <button type="submit">Reset Password</button>
      <button class="link" type="button" id="backBtn">Back to login</button>
      <div class="msg" id="forgotMsg"></div>
    </form>
  </main>
<script>
(async()=>{const r=await fetch('/api/admin/status');const d=await r.json();if(d.setupRequired)location.replace('/admin/setup.html');else{const s=await fetch('/api/session');const x=await s.json();if(x.authenticated&&x.session?.role==='admin')location.replace('/admin/')}})().catch(()=>{});
const loginForm=document.getElementById('loginForm'),forgotForm=document.getElementById('forgotForm'),msg=document.getElementById('msg');
document.getElementById('forgotBtn').onclick=()=>{loginForm.hidden=true;forgotForm.hidden=false};document.getElementById('backBtn').onclick=()=>{forgotForm.hidden=true;loginForm.hidden=false};
loginForm.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Signing in…';const f=new FormData(e.currentTarget);const r=await fetch('/api/admin/signin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Login failed';return}location.replace('/admin/')});
forgotForm.addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('forgotMsg');m.textContent='Resetting…';const f=new FormData(e.currentTarget);const r=await fetch('/api/admin/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();if(!r.ok){m.textContent=d.error||'Reset failed';return}m.textContent='Password reset. You can now sign in.';forgotForm.reset();setTimeout(()=>{forgotForm.hidden=true;loginForm.hidden=false},700)})
</script>
</body>
</html>
