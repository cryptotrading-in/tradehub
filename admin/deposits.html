<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tradehub Admin · Deposits</title><link rel="stylesheet" href="/styles.css"><style>html.auth-check body{visibility:hidden}.admin-shell{min-height:100vh}.page-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(20,25,37,.72);box-shadow:var(--shadow-card);margin-bottom:14px}.page-card h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid label{display:block;font-size:11px;color:#9ba5b7;margin-bottom:5px}.grid input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid var(--line);background:#ffffff08;color:#fff}.save{margin-top:12px;border:0;border-radius:10px;padding:11px 16px;background:#7c6cff;color:#fff;font-weight:800}.msg{font-size:12px;color:#9ba5b7;margin-top:8px}.table-wrap{overflow:auto}.rows{min-width:760px}.row{display:grid;grid-template-columns:1.1fr .8fr .8fr 1.2fr 1fr 1fr;gap:10px;padding:12px;border-bottom:1px solid #ffffff0d;font-size:12px;align-items:center}.row.head{font-size:11px;color:#9ba5b7;font-weight:800}.badge{font-weight:800}.pending{color:#ffb84d}.approved{color:#29c98a}.rejected{color:#ff5f70}.actions button{border:0;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer;margin-right:5px}.approve{background:#29c98a;color:#07120d}.reject{background:#ff5f70;color:#fff}.empty{padding:20px;color:#9ba5b7;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1.2fr .8fr .8fr 1.3fr 1fr 1fr}}</style><script>document.documentElement.classList.add('auth-check');fetch('/api/admin/session').then(r=>r.json()).then(s=>{if(!s.authenticated||s.session?.role!=='admin')location.replace('/admin/login.html');else document.documentElement.classList.remove('auth-check')}).catch(()=>location.replace('/admin/login.html'));</script></head><body class="shell-page"><div class="app-shell admin-shell"><aside class="sidebar admin-sidebar"><div class="brand">TRADE<span>HUB</span><small>ADMIN</small></div><nav class="shell-nav"><button class="nav-item" onclick="location.href='/admin/'">Overview</button><button class="nav-item" onclick="location.href='/admin/users.html'">Users</button><button class="nav-item" onclick="location.href='/admin/clients.html'">Clients</button><button class="nav-item" onclick="location.href='/admin.html'">Rounds</button><button class="nav-item active">Deposit Requests</button><button class="nav-item" onclick="alert('Withdrawal Requests will be enabled in the withdrawal step.')">Withdrawal Requests</button></nav><div style="margin-top:auto"><button class="nav-item" onclick="logout()">Logout</button></div></aside><div class="shell-main"><header class="topbar"><button class="mobile-menu" onclick="location.href='/admin/'">←</button><div><p class="eyebrow">TRADEHUB · ADMIN</p><h1>Deposit Requests</h1></div><div class="topbar-status"><span class="status status-live">System ready</span></div></header><main class="shell-content"><section class="page-card"><h2>Deposit Settings</h2><div class="grid"><div><label>TRC20 Wallet Address</label><input id="trc20" placeholder="TRC20 address"></div><div><label>ERC20 Wallet Address</label><input id="erc20" placeholder="ERC20 address"></div><div><label>Minimum Deposit (USDT)</label><input id="minimum" type="number" min="1" step="0.01" value="151"></div></div><button class="save" onclick="saveSettings()">Save Deposit Settings</button><div id="settingsMsg" class="msg"></div></section><section class="page-card"><h2>Requests</h2><div class="table-wrap"><div class="rows"><div class="row head"><span>Client</span><span>Amount</span><span>Network</span><span>TXID</span><span>Status</span><span>Action</span></div><div id="rows"><div class="empty">Loading…</div></div></div></div></section></main></div></div><script>async function loadSettings(){let x=await fetch('/api/admin/deposit-settings');let d=await x.json();if(!x.ok||!d.ok)return;document.getElementById('trc20').value=d.settings.trc20Address||'';document.getElementById('erc20').value=d.settings.erc20Address||'';document.getElementById('minimum').value=d.settings.minimumDeposit||151}async function saveSettings(){let msg=document.getElementById('settingsMsg');msg.textContent='Saving…';let x=await fetch('/api/admin/deposit-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trc20Address:document.getElementById('trc20').value,erc20Address:document.getElementById('erc20').value,minimumDeposit:Number(document.getElementById('minimum').value)})});let d=await x.json();msg.textContent=x.ok&&d.ok?'Saved.':(d.error||'Unable to save.')}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function loadRequests(){let x=await fetch('/api/admin/deposits');let d=await x.json();if(!x.ok||!d.ok){document.getElementById('rows').innerHTML='<div class="empty">Unable to load requests.</div>';return}let list=d.deposits||[];document.getElementById('rows').innerHTML=list.map(v=>'<div class="row"><span>'+esc(v.full_name)+'<br><small>'+esc(v.username)+'</small></span><span>'+Number(v.amount).toFixed(2)+' USDT</span><span>'+esc(v.network)+'</span><span title="'+esc(v.txid)+'">'+esc(v.txid.slice(0,18))+'…</span><span class="badge '+v.status.toLowerCase()+'">'+esc(v.status)+'</span><span class="actions">'+(v.status==='Pending'?'<button class="approve" onclick="act(\''+v.id+'\',\'approve\')">Approve</button><button class="reject" onclick="act(\''+v.id+'\',\'reject\')">Reject</button>':'—')+'</span></div>').join('')||'<div class="empty">No deposit requests yet.</div>'}async function act(id,action){let reason=action==='reject'?prompt('Rejection reason (optional):')||'Rejected by admin':null;if(!confirm(action==='approve'?'Approve and credit this deposit?':'Reject this deposit?'))return;let x=await fetch('/api/admin/deposits/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,reason})});let d=await x.json();if(!x.ok||!d.ok)return alert(d.error||'Action failed');await loadRequests()}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.replace('/admin/login.html')}loadSettings();loadRequests();setInterval(loadRequests,10000);</script></body></html>
