<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradehub Admin</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>html.auth-check body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('auth-check');fetch('/api/session').then(r=>r.json()).then(s=>{if(!s.authenticated||s.session?.role!=='admin')location.replace('/admin/login.html');else document.documentElement.classList.remove('auth-check')}).catch(()=>location.replace('/admin/login.html'));</script>
</head>
<body class="shell-page admin-shell-page">
  <div class="app-shell admin-shell">
    <aside class="sidebar admin-sidebar" aria-label="Admin navigation">
      <div class="brand">TRADE<span>HUB</span><small>ADMIN</small></div>
      <nav class="shell-nav">
        <button class="nav-item active" type="button">Overview</button>
        <button class="nav-item" type="button" onclick="location.href='/admin/users.html'">Users</button>
        <button class="nav-item" type="button" onclick="location.href='/admin.html'">Rounds</button>
        <button class="nav-item" type="button">Orders</button>
        <button class="nav-item" type="button">Settings</button>
      </nav>
      <div class="admin-sidebar-footer">
        <button class="nav-item admin-logout" type="button" onclick="logout()">Logout</button>
      </div>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="mobile-menu" type="button" aria-label="Open admin menu" aria-expanded="false">☰</button>
        <div>
          <p class="eyebrow">TRADEHUB · ADMIN</p>
          <h1>Control center</h1>
        </div>
        <div class="topbar-status"><span class="status status-live">System ready</span></div>
      </header>

      <main class="shell-content">
        <section class="shell-hero glass-card">
          <span class="label">Admin shell</span>
          <h2>Professional management workspace.</h2>
          <p>Admin authentication is connected. Use Users to create staff accounts and Rounds to manage the existing round configuration.</p>
        </section>
      </main>
    </div>
  </div>
<script>async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.replace('/admin/login.html')}</script>
</body>
</html>
