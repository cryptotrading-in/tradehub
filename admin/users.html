<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Tradehub · Staff</title><link rel="stylesheet" href="/styles.css"/><style>.wrap{max-width:900px;margin:30px auto;padding:20px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form input{padding:11px;border-radius:9px;border:1px solid #ffffff22;background:#ffffff08;color:inherit}.form button{grid-column:1/-1;padding:11px;border:0;border-radius:9px}.msg{min-height:20px}.staff{margin-top:20px;display:grid;gap:10px}.person{padding:14px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff12}@media(max-width:600px){.form{grid-template-columns:1fr}}</style></head>
<body class="shell-page"><main class="wrap"><section class="glass-card" style="padding:22px"><span class="label">TRADEHUB · USERS</span><h1>Staff Accounts</h1><p>Create login accounts for admin staff. Only the Master Admin can create staff accounts.</p><form class="form" id="form"><input name="fullName" placeholder="Staff name" required/><input name="username" placeholder="Username" required/><input name="email" type="email" placeholder="Email (optional)"/><input name="password" type="password" placeholder="Password" required/><button type="submit">Create Staff Account</button><div class="msg" id="msg"></div></form><div class="staff" id="staff"></div></section></main><script>
(async()=>{const s=await fetch('/api/admin/session');const d=await s.json();if(!d.authenticated||d.session?.role!=='admin')return location.replace('/admin/login.html');load()})().catch(()=>location.replace('/admin/login.html'));
async function load(){const r=await fetch('/api/admin/staff');const d=await r.json();if(!r.ok)return document.getElementById('msg').textContent=d.error||'Unable to load staff';document.getElementById('staff').innerHTML=(d.staff||[]).map(x=>`<div class="person"><strong>${escapeHtml(x.full_name)}</strong><br>@${escapeHtml(x.username)} · ${escapeHtml(x.role)} · ${escapeHtml(x.status)}</div>`).join('')||'<p>No staff accounts yet.</p>'}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');const f=new FormData(e.currentTarget);msg.textContent='Creating…';const r=await fetch('/api/admin/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});const d=await r.json();msg.textContent=r.ok?'Staff account created.':(d.error||'Unable to create account');if(r.ok){e.currentTarget.reset();load()}})
</script></body></html>
