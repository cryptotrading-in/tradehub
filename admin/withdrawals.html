<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tradehub Admin · Withdrawals</title><link rel="stylesheet" href="/styles.css"><style>html.auth-check body{visibility:hidden}.admin-shell{min-height:100vh}.page-card{padding:18px;border:1px solid var(--line);border-radius:18px;background:rgba(20,25,37,.72);box-shadow:var(--shadow-card)}.table-wrap{overflow:auto}.rows{min-width:980px}.row{display:grid;grid-template-columns:1.15fr .75fr .7fr 1.65fr .85fr 1.55fr;gap:10px;padding:12px;border-bottom:1px solid #ffffff0d;font-size:12px;align-items:center}.row.head{font-size:11px;color:#9ba5b7;font-weight:800}.badge{font-weight:800}.pending{color:#ffb84d}.approved{color:#29c98a}.processing{color:#7c6cff}.completed{color:#29c98a}.rejected{color:#ff5f70}.addr{word-break:break-all}.actions button{border:0;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer;margin:2px}.approve{background:#29c98a;color:#07120d}.process{background:#7c6cff;color:#fff}.complete{background:#29c98a;color:#07120d}.reject{background:#ff5f70;color:#fff}.copy{background:#ffffff10;color:#fff}.empty{padding:20px;color:#9ba5b7;font-size:12px}@media(max-width:720px){.row{grid-template-columns:1.15fr .75fr .7fr 1.65fr .85fr 1.55fr}}</style><script>document.documentElement.classList.add('auth-check');fetch('/api/admin/session').then(r=>r.json()).then(s=>{if(!s.authenticated||s.session?.role!=='admin')location.replace('/admin/login.html');else document.documentElement.classList.remove('auth-check')}).catch(()=>location.replace('/admin/login.html'));</script></head><body class="shell-page"><div class="app-shell admin-shell"><aside class="sidebar admin-sidebar"><div class="brand">TRADE<span>HUB</span><small>ADMIN</small></div><nav class="shell-nav"><button class="nav-item" onclick="location.href='/admin/'">Overview</button><button class="nav-item" onclick="location.href='/admin/users.html'">Users</button><button class="nav-item" onclick="location.href='/admin/clients.html'">Clients</button><button class="nav-item" onclick="location.href='/admin.html'">Rounds</button><button class="nav-item" onclick="location.href='/admin/deposits.html'">Deposit Requests</button><button class="nav-item active">Withdrawal Requests</button></nav><div style="margin-top:auto"><button class="nav-item" onclick="logout()">Logout</button></div></aside><div class="shell-main"><header class="topbar"><button class="mobile-menu" onclick="location.href='/admin/'">←</button><div><p class="eyebrow">TRADEHUB · ADMIN</p><h1>Withdrawal Requests</h1></div><div class="topbar-status"><span class="status status-live">System ready</span></div></header><main class="shell-content"><section class="page-card"><div class="table-wrap"><div class="rows"><div class="row head"><span>Client</span><span>Amount</span><span>Network</span><span>Withdrawal Address</span><span>Status</span><span>Action</span></div><div id="rows"><div class="empty">Loading…</div></div></div></div></section></main></div></div><script>function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){let x=await fetch('/api/admin/withdrawals');let d=await x.json();if(!x.ok||!d.ok){rows.innerHTML='<div class="empty">Unable to load requests.</div>';return}let list=d.withdrawals||[];rows.innerHTML=list.map(v=>{let actions='';if(v.status==='Pending')actions='<button class="approve" onclick="act(\''+v.id+'\',\'approve\')">Approve</button><button class="reject" onclick="act(\''+v.id+'\',\'reject\')">Reject</button>';else if(v.status==='Approved')actions='<button class="process" onclick="act(\''+v.id+'\',\'processing\')">Processing</button><button class="reject" onclick="act(\''+v.id+'\',\'reject\')">Reject</button>';else if(v.status==='Processing')actions='<button class="complete" onclick="act(\''+v.id+'\',\'complete\')">Completed</button><button class="reject" onclick="act(\''+v.id+'\',\'reject\')">Reject</button>';return '<div class="row"><span>'+esc(v.full_name)+'<br><small>'+esc(v.username)+'</small></span><span>'+Number(v.amount).toFixed(2)+' USDT</span><span>'+esc(v.network)+'</span><span class="addr">'+esc(v.withdrawal_address)+'<br><button class="copy" onclick="navigator.clipboard.writeText('+JSON.stringify(v.withdrawal_address)+')">Copy</button></span><span class="badge '+v.status.toLowerCase()+'">'+esc(v.status)+'</span><span class="actions">'+(actions||'—')+'</span></div>'}).join('')||'<div class="empty">No withdrawal requests yet.</div>'}async function act(id,action){let reason=action==='reject'?prompt('Rejection reason (optional):')||'Rejected by admin':null;if(!confirm(action==='approve'?'Approve this withdrawal?':action==='processing'?'Move this withdrawal to Processing?':action==='complete'?'Mark this withdrawal Completed?':'Reject this withdrawal?'))return;let x=await fetch('/api/admin/withdrawals/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,action,reason})});let d=await x.json();if(!x.ok||!d.ok)return alert(d.error||'Action failed');await load()}async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.replace('/admin/login.html')}load();setInterval(load,10000)</script></body></html>
