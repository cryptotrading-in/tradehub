<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tradehub Admin · Rounds</title><link rel="stylesheet" href="/styles.css"><style>.rounds-admin{display:grid;gap:12px}.ar{padding:16px;border:1px solid #ffffff1a;border-radius:18px;background:#141925b8}.arh{display:flex;justify-content:space-between;gap:10px}.argrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.argrid label{font-size:11px;color:#9ba5b7}.argrid input,.argrid select{width:100%;box-sizing:border-box;margin-top:4px;padding:10px;border-radius:10px;border:1px solid #ffffff1a;background:#ffffff08;color:#fff}.save{margin-top:12px;border:0;border-radius:10px;padding:10px 14px;background:#7c6cff;color:#fff;font-weight:800;cursor:pointer}.fixed{color:#9ba5b7;font-size:12px;margin-top:12px}.err{color:#ff5f70;font-size:13px}.ok{color:#29c98a;font-size:13px}@media(max-width:700px){.argrid{grid-template-columns:1fr}}</style></head><body class="shell-page admin-shell-page"><div class="app-shell admin-shell"><aside class="sidebar admin-sidebar"><div class="brand">TRADE<span>HUB</span><small>ADMIN</small></div><nav class="shell-nav"><button class="nav-item active">Rounds</button></nav></aside><div class="shell-main"><header class="topbar"><button class="mobile-menu">☰</button><div><p class="eyebrow">TRADEHUB · ADMIN</p><h1>Round Management</h1></div><div class="topbar-status"><span class="status status-live">2 Rounds</span></div></header><main class="shell-content"><section class="shell-hero glass-card"><span class="label">24-HOUR CYCLE</span><h2>Configure the next round outcomes.</h2><p>Only Direction, Start Time, Duration, Profit, Fee and Result are editable. Minimum wallet balances and the two-round limit are system rules.</p></section><section id="rounds-admin" class="rounds-admin" style="margin-top:16px"></section><div id="admin-msg" class="fixed"></div></main></div></div><script>const box=document.getElementById('rounds-admin'),msg=document.getElementById('admin-msg'),min={1:150,2:250};const PKT_OFFSET_MS=5*60*60*1000;const timeLocal=ts=>{let d=new Date(ts*1000+PKT_OFFSET_MS);return d.toISOString().slice(0,16)};const pktToEpochSeconds=value=>Math.floor(new Date(value+'+05:00').getTime()/1000);async function load(){let r=await fetch('/api/admin/rounds',{credentials:'same-origin'}),d=await r.json().catch(()=>({}));if(!r.ok){msg.className='err';msg.textContent=d.error||'Admin session required.';return}box.innerHTML=(d.rounds||[]).map(x=>`<article class="ar" data-id="${x.id||''}" data-no="${x.round_no}"><div class="arh"><b>ROUND ${x.round_no}</b><span class="fixed">Minimum ${min[x.round_no]} USDT</span></div><div class="argrid"><label>Direction<select data-f="direction"><option ${x.direction==='UP'?'selected':''}>UP</option><option ${x.direction==='DOWN'?'selected':''}>DOWN</option></select></label><label>Start time (PKT)<input data-f="startAt" type="datetime-local" value="${timeLocal(x.start_at)}"></label><label>Duration (seconds)<input data-f="durationSeconds" type="number" min="15" value="${x.duration_seconds}"></label><label>Profit %<input data-f="profitPct" type="number" min="0" step="0.01" value="${x.profit_pct}"></label><label>Fee %<input data-f="feePct" type="number" min="0" step="0.01" value="${x.fee_pct}"></label><label>Result<select data-f="result"><option ${x.result==='WIN'?'selected':''}>WIN</option><option ${x.result==='LOSS'?'selected':''}>LOSS</option></select></label></div><button class="save" onclick="saveRound(this)">Save Round</button></article>`).join('');}async function saveRound(btn){let a=btn.closest('.ar'),g=f=>a.querySelector('[data-f="'+f+'"]');let payload={roundNo:Number(a.dataset.no),direction:g('direction').value,startAt:pktToEpochSeconds(g('startAt').value),durationSeconds:Number(g('durationSeconds').value),profitPct:Number(g('profitPct').value),feePct:Number(g('feePct').value),result:g('result').value};let r=await fetch('/api/admin/rounds',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));msg.className=r.ok?'ok':'err';msg.textContent=r.ok?'Round '+payload.roundNo+' saved.':(d.error||'Save failed.');}load();</script></body></html>
