<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b12"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/nexus.svg"><title>Tradehub</title><link rel="stylesheet" href="/styles.css"><style>
#rounds,#wallet{display:none;margin-top:16px}.show{display:block!important}.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.rc,.tp,.wb{padding:16px;border:1px solid #ffffff1a;border-radius:18px;background:#141925b8}.rt{display:flex;justify-content:space-between}.rs{font-size:11px;font-weight:800}.open{color:#29c98a}.lock{color:#ffb84d}.up{color:#9ba5b7}.res{color:#7c6cff}.rd{font-size:28px;font-weight:900;margin:14px 0 5px}.rm{font-size:12px;color:#9ba5b7;line-height:1.7}.rc button,.tp button{width:100%;border:0;border-radius:10px;padding:10px;font-weight:800;cursor:pointer;margin-top:12px}.bp{background:#7c6cff;color:white}.bm{background:#ffffff0b;color:#9ba5b7}.tp{margin-top:12px}.tc{float:right;background:#ff5f7026!important;color:#ff5f70;width:auto!important;margin:0!important}.cw{margin-top:14px;background:#0b0f18;border-radius:12px;overflow:hidden}.cw svg{width:100%;height:220px;display:block}.ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.ts div{padding:10px;background:#ffffff0a;border-radius:10px;font-size:12px}.ts span{display:block;color:#9ba5b7;font-size:11px}.tf{display:grid;grid-template-columns:1fr 130px;gap:8px;margin-top:12px}.tf input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #ffffff1a;background:#ffffff08;color:#fff}.bal{font-size:32px;font-weight:900}.wl{display:grid;gap:8px;margin-top:12px}.wr{display:flex;justify-content:space-between;padding:10px;background:#ffffff08;border-radius:10px;font-size:12px}.note{font-size:12px;color:#9ba5b7;margin-top:10px}@media(max-width:900px){.rg{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.rg{grid-template-columns:1fr}.tf,.ts{grid-template-columns:1fr}}
</style></head><body class="shell-page"><div class="app-shell client-shell"><aside class="sidebar"><div class="brand">TRADE<span>HUB</span></div><nav class="shell-nav"><button class="nav-item active" data-r="/">Home</button><button class="nav-item" data-r="/rounds">Rounds</button><button class="nav-item" data-r="/wallet">Wallet</button><button class="nav-item" data-r="/account">Account</button></nav></aside><div class="shell-main"><header class="topbar"><button class="mobile-menu">☰</button><div><p class="eyebrow">TRADEHUB</p><h1>Premium trading workspace</h1></div><div class="topbar-status"><span class="status status-live">Ready</span><span id="auth" style="display:none;color:#29c98a;font-size:13px;font-weight:700">● Account Active</span></div></header><main class="shell-content"><section class="shell-hero glass-card"><span class="label">TRADEHUB</span><h2 id="title">Your trading experience starts here.</h2><p id="desc">Trade smarter with a simple, secure workspace.</p><div id="cta" style="display:none;margin-top:18px"><a href="/signup/">Create Account</a> <a href="/signin/">Sign In</a></div></section><section id="rounds"><div id="rg" class="rg"></div><div id="tp" class="tp" hidden></div><div class="note">Five rounds only. Fixed minimums: R1 50 · R2 100 · R3 150 · R4 200 · R5 250 USDT.</div></section><section id="wallet"><div class="wb"><div class="label">WALLET</div><div id="bal" class="bal">0.00 USDT</div><div id="wl" class="wl"></div></div></section></main><nav class="mobile-nav"><button class="nav-item active" data-r="/">Home</button><button class="nav-item" data-r="/rounds">Rounds</button><button class="nav-item" data-r="/wallet">Wallet</button><button class="nav-item" data-r="/account">Account</button></nav></div></div>
<script>
(()=>{const P={'/':['Your trading experience starts here.','Trade smarter with a simple, secure workspace.'],'/rounds':['Trading rounds','Round → Entry Window → Countdown → Locked → Result → Balance Update.'],'/wallet':['Wallet','Your server-side balance and settlement ledger.'],'/account':['Account','Account workspace is ready.']},$=id=>document.getElementById(id),norm=p=>!p||p==='/index.html'?'/':p.replace(/\/$/,'')||'/',money=n=>Number(n||0).toFixed(2);let R=[],B=0,S=null;function state(r){let n=Date.now()/1000,e=Number(r.startAt),x=e+Number(r.durationSeconds),w=Math.max(15,Math.floor(r.entryWindowSeconds));return n<e?'UPCOMING':n<e+w?'ENTRY_OPEN':n<x?'LOCKED':'RESULT'}function draw(r){let pts=[],d=r.direction==='UP'?1:-1;for(let i=0;i<32;i++){let q=i/31,x=20+q*860,y=110-(d*q*70+Math.sin(q*6.28+r.roundNo*2)*8);pts.push(x.toFixed(1)+','+y.toFixed(1))}return '<svg viewBox="0 0 900 220"><line x1="0" y1="55" x2="900" y2="55" stroke="#ffffff14"/><line x1="0" y1="110" x2="900" y2="110" stroke="#ffffff14"/><line x1="0" y1="165" x2="900" y2="165" stroke="#ffffff14"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#7c6cff" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="110" r="6" fill="#29c98a"/><circle cx="880" cy="'+(110-d*70)+'" r="6" fill="#ff5f70"/></svg>'}async function load(){try{let x=await fetch('/api/rounds',{credentials:'same-origin',cache:'no-store'}),d=await x.json();if(!x.ok||!d.ok)return;B=Number(d.balance||0);R=(d.rounds||[]).map(r=>({...r,state:state(r)}));$('rg').innerHTML=R.map(r=>'<div class="rc"><div class="rt"><b>ROUND '+r.roundNo+'</b><span class="rs '+(r.state==='ENTRY_OPEN'?'open':r.state==='LOCKED'?'lock':r.state==='RESULT'?'res':'up')+'">'+r.state+'</span></div><div class="rd">'+(r.direction==='UP'?'UP ↑':'DOWN ↓')+'</div><div class="rm">Start '+new Date(r.startAt*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br>Duration '+Math.round(r.durationSeconds/60)+' min<br>Profit '+money(r.profitPct)+'% · Fee '+money(r.feePct)+'%<br>Min '+money(r.minBalance)+' USDT</div><button class="'+(r.canEnter?'bp':'bm')+'" '+(r.canEnter?'':'disabled')+' onclick="openRound(\''+r.id+'\')">'+(r.canEnter?'Enter Round':r.state==='RESULT'?'View Result':B<r.minBalance?'Locked by Balance':r.state)+'</button></div>').join('');if(S){S=R.find(r=>r.id===S.id)||S;if(!$('tp').hidden)showTrade()}}catch{}}window.openRound=id=>{S=R.find(r=>r.id===id);$('tp').hidden=false;showTrade();$('tp').scrollIntoView({behavior:'smooth'})};function showTrade(){let r=S;if(!r)return;let t=r.trade,n=Math.floor(Date.now()/1000),rem=Math.max(0,r.startAt+r.durationSeconds-n);$('tp').innerHTML='<button class="tc" onclick="$(\'tp\').hidden=true">Close</button><div class="label">ROUND '+r.roundNo+'</div><h3>'+r.direction+' '+(r.direction==='UP'?'↑':'↓')+' · '+r.state+'</h3><div class="cw">'+draw(r)+'</div><div class="ts"><div><span>Entry</span><b>'+(t?money(t.entryPrice):'—')+'</b></div><div><span>Current/Exit</span><b>'+(t?money(t.exitPrice||0):'—')+'</b></div><div><span>Wallet</span><b>'+money(B)+' USDT</b></div></div>'+(t?'<div class="note">Investment '+money(t.investment)+' USDT · Result '+t.result+' · '+t.status+(t.status==='SETTLED'?' · Net P&L '+money(t.netPnl)+' USDT':'')+'</div>':r.canEnter?'<div class="tf"><input id="inv" type="number" min="0.01" step="0.01" placeholder="Investment USDT"><button class="bp" onclick="trade()">Start Trade</button></div>':'<div class="note">'+(r.state==='LOCKED'?'Trade window locked.':'Round is not open.')+'</div>')+(rem>0?'<div class="note">Countdown '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0')+'</div>':'')}window.trade=async()=>{let v=Number($('inv').value);if(!v||!S)return;let x=await fetch('/api/rounds/trade',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({roundId:S.id,investment:v})}),d=await x.json();if(!x.ok)return alert(d.error||'Trade could not be started');await load();openRound(S.id)};async function wallet(){try{let x=await fetch('/api/wallet',{credentials:'same-origin'}),d=await x.json();if(!x.ok||!d.ok)return;$('bal').textContent=money(d.balance)+' USDT';$('wl').innerHTML=(d.transactions||[]).map(t=>'<div class="wr"><span>'+t.type.replaceAll('_',' ')+'<br>'+new Date(t.created_at*1000).toLocaleString()+'</span><b>'+money(t.amount)+' USDT</b></div>').join('')||'<div class="note">No transactions yet.</div>'}catch{}}function render(p){p=norm(p);let q=P[p]||P['/'];$('title').textContent=q[0];$('desc').textContent=q[1];$('rounds').classList.toggle('show',p==='/rounds');$('wallet').classList.toggle('show',p==='/wallet');document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',norm(b.dataset.r)===p));if(p==='/rounds')load();if(p==='/wallet')wallet()}document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let p=norm(b.dataset.r);if(p!==norm(location.pathname))history.pushState({},'',p);render(p)});onpopstate=()=>render(location.pathname);render(location.pathname);fetch('/api/session',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.authenticated){$('auth').style.display='inline';if(norm(location.pathname)==='/'&&d.session?.fullName)$('title').textContent='Welcome, '+d.session.fullName}else $('cta').style.display='block'}).catch(()=>$('cta').style.display='block');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));setInterval(()=>{if(norm(location.pathname)==='/rounds')load()},1000)})();
</script></body></html>
