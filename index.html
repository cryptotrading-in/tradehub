</style></head><body class="shell-page"><div class="app-shell client-shell"><aside class="sidebar"><div class="brand">TRADE<span>HUB</span></div><nav class="shell-nav"><button class="nav-item active" data-r="/">Home</button><button class="nav-item" data-r="/rounds">Rounds</button><button class="nav-item" data-r="/wallet">Wallet</button><button class="nav-item" data-r="/account">Account</button></nav></aside><div class="shell-main"><header class="topbar"><button class="mobile-menu">☰</button><div><p class="eyebrow">TRADEHUB</p><h1>Premium trading workspace</h1></div><div class="topbar-status"><span class="status status-live">Ready</span><span id="auth" style="display:none;color:#29c98a;font-size:13px;font-weight:700">● Account Active</span></div></header><main class="shell-content"><section class="shell-hero glass-card"><span class="label">TRADEHUB</span><h2 id="title">Your trading experience starts here.</h2><p id="desc">Trade smarter with a simple, secure workspace.</p><div id="cta" style="display:none;margin-top:18px"><a href="/signup/">Create Account</a> <a href="/signin/">Sign In</a></div></section><section id="rounds"><div id="rg" class="rg"></div><div id="tp" class="tp" hidden></div></section><section id="wallet"><div class="wallet-card"><div class="wallet-head"><div class="wallet-title">WALLET</div><div class="wallet-caption">Available Balance</div><div id="bal" class="bal">0.00 USDT</div></div><div class="wallet-actions"><button class="wallet-deposit" id="depositBtn" type="button">Deposit</button><button class="wallet-withdraw" type="button">Withdraw</button></div><div id="depositPanel" class="deposit-panel" hidden><h3>Deposit USDT</h3><div class="note">Minimum deposit: <b id="depositMinimum">151.00 USDT</b></div><label for="depositNetwork">Network</label><select id="depositNetwork"><option value="TRC20">TRC20</option><option value="ERC20">ERC20</option></select><label>Wallet Address</label><div class="deposit-address"><input id="depositAddress" readonly value="Not configured"><button type="button" onclick="copyDepositAddress()">Copy Address</button></div><label for="depositAmount">Amount (USDT)</label><input id="depositAmount" type="number" min="151" step="0.01" placeholder="151.00"><label for="depositTxid">Transaction ID / Hash</label><input id="depositTxid" placeholder="Enter TXID / transaction hash"><label for="depositReceipt">Screenshot / Receipt</label><input id="depositReceipt" type="file" accept="image/png,image/jpeg,image/webp"><button class="deposit-submit" type="button" onclick="submitDeposit()">Submit Deposit</button><div id="depositMsg" class="deposit-msg"></div></div><div class="wallet-section-title">Recent Activity</div><div id="wl" class="wl"></div><div class="deposit-history"><div class="wallet-section-title">Deposit History</div><div id="depositHistory"></div></div></div></section></main><nav class="mobile-nav"><button class="nav-item active" data-r="/">Home</button><button class="nav-item" data-r="/rounds">Rounds</button><button class="nav-item" data-r="/wallet">Wallet</button><button class="nav-item" data-r="/account">Account</button></nav></div></div>
<script>
(()=>{const P={'/':['Your trading experience starts here.','Trade smarter with a simple, secure workspace.'],'/rounds':['Trading rounds','Round → Entry Window → Countdown → Locked → Result → Balance Update.'],'/wallet':['Wallet','Your server-side balance and settlement ledger.'],'/account':['Account','Account workspace is ready.']},$=id=>document.getElementById(id),norm=p=>!p||p==='/index.html'?'/':p.replace(/\/$/,'')||'/',money=n=>Number(n||0).toFixed(2);let R=[],B=0,S=null,lastRoundsLoad=0,roundsLoadInFlight=false,depositSettings=null;function state(r){let n=Date.now()/1000,e=Number(r.startAt),x=e+Number(r.durationSeconds),w=Math.max(15,Math.floor(r.entryWindowSeconds));return n<e?'UPCOMING':n<e+w?'ENTRY_OPEN':n<x?'LOCKED':'RESULT'}function draw(r){let pts=[],d=r.direction==='UP'?1:-1;for(let i=0;i<32;i++){let q=i/31,x=20+q*860,y=110-(d*q*70+Math.sin(q*6.28+r.roundNo*2)*8);pts.push(x.toFixed(1)+','+y.toFixed(1))}return '<svg viewBox="0 0 900 220"><line x1="0" y1="55" x2="900" y2="55" stroke="#ffffff14"/><line x1="0" y1="110" x2="900" y2="110" stroke="#ffffff14"/><line x1="0" y1="165" x2="900" y2="165" stroke="#ffffff14"/><polyline points="'+pts.join(' ')+'" fill="none" stroke="#7c6cff" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="110" r="6" fill="#29c98a"/><circle cx="880" cy="'+(110-d*70)+'" r="6" fill="#ff5f70"/></svg>'}async function load(force=false){let now=Date.now();if(roundsLoadInFlight)return;if(!force&&now-lastRoundsLoad<5000)return;roundsLoadInFlight=true;lastRoundsLoad=now;try{let x=await fetch('/api/rounds',{credentials:'same-origin',cache:'no-store'}),d=await x.json();if(!x.ok||!d.ok)return;B=Number(d.balance||0);R=(d.rounds||[]).map(r=>({...r,state:r.state||state(r)}));$('rg').innerHTML=R.map(r=>'<div class="rc"><div class="rt"><b>ROUND '+r.roundNo+'</b><span class="rs '+(r.state==='ENTRY_OPEN'?'open':r.state==='LOCKED'?'lock':r.state==='RESULT'?'res':'up')+'">'+r.state+'</span></div><div class="rd">'+(r.direction==='UP'?'UP ↑':'DOWN ↓')+'</div><div class="rm">Start '+new Date(r.startAt*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'<br>Duration '+Math.round(r.durationSeconds/60)+' min<br>Profit '+money(r.profitPct)+'% · Fee '+money(r.feePct)+'%<br>Min '+money(r.minBalance)+' USDT</div><button class="'+(r.canEnter?'bp':'bm')+'" '+(r.canEnter?'':'disabled')+' onclick="openRound(\''+r.id+'\')">'+(r.canEnter?'Enter Round':r.state==='RESULT'?'View Result':B<r.minBalance?'Locked by Balance':r.state)+'</button></div>').join('');if(S){S=R.find(r=>r.id===S.id)||S;if(!$('tp').hidden)showTrade()}}catch{}finally{roundsLoadInFlight=false}}window.openRound=id=>{S=R.find(r=>r.id===id);$('tp').hidden=false;showTrade();$('tp').scrollIntoView({behavior:'smooth'})};function showTrade(){let r=S;if(!r)return;let t=r.trade,n=Math.floor(Date.now()/1000),rem=Math.max(0,r.startAt+r.durationSeconds-n);$('tp').innerHTML='<button class="tc" onclick="$(\'tp\').hidden=true">Close</button><div class="label">ROUND '+r.roundNo+'</div><h3>'+r.direction+' '+(r.direction==='UP'?'↑':'↓')+' · '+r.state+'</h3><div class="cw">'+draw(r)+'</div><div class="ts"><div><span>Entry</span><b>'+(t?money(t.entryPrice):'—')+'</b></div><div><span>Current/Exit</span><b>'+(t?money(t.exitPrice||0):'—')+'</b></div><div><span>Wallet</span><b>'+money(B)+' USDT</b></div></div>'+(t?'<div class="note">Investment '+money(t.investment)+' USDT · Result '+t.result+' · '+t.status+(t.status==='SETTLED'?' · Net P&L '+money(t.netPnl)+' USDT':'')+'</div>':r.canEnter?'<div class="tf"><input id="inv" type="number" min="0.01" step="0.01" placeholder="Investment USDT"><button class="bp" onclick="trade()">Start Trade</button></div>':'<div class="note">'+(r.state==='LOCKED'?'Trade window locked.':'Round is not open.')+'</div>')+(rem>0?'<div class="note">Countdown '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0')+'</div>':'')}window.trade=async()=>{let v=Number($('inv').value);if(!v||!S)return;let x=await fetch('/api/rounds/trade',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({roundId:S.id,investment:v})}),d=await x.json();if(!x.ok)return alert(d.error||'Trade could not be started');await load(true);openRound(S.id)};async function wallet(){try{let x=await fetch('/api/wallet',{credentials:'same-origin'}),d=await x.json();if(!x.ok||!d.ok)return;$('bal').textContent=money(d.balance)+' USDT';$('wl').innerHTML=(d.transactions||[]).map(t=>'<div class="wr"><span>'+t.type.replaceAll('_',' ')+'<br>'+new Date(t.created_at*1000).toLocaleString()+'</span><b>'+money(t.amount)+' USDT</b></div>').join('')||'<div class="note">No transactions yet.</div>';await loadDepositSettings();await loadDepositHistory()}catch{}}async function loadDepositSettings(){try{let x=await fetch('/api/deposit-settings',{credentials:'same-origin'}),d=await x.json();if(!x.ok||!d.ok)return;depositSettings=d.settings;$('depositMinimum').textContent=money(depositSettings.minimumDeposit)+' USDT';$('depositAmount').min=depositSettings.minimumDeposit;updateDepositAddress()}catch{}}function updateDepositAddress(){if(!depositSettings)return;let n=$('depositNetwork').value,a=n==='TRC20'?depositSettings.trc20Address:depositSettings.erc20Address;$('depositAddress').value=a||'Not configured'}async function loadDepositHistory(){try{let x=await fetch('/api/deposits',{credentials:'same-origin'}),d=await x.json();if(!x.ok||!d.ok)return;$('depositHistory').innerHTML=(d.deposits||[]).map(v=>'<div class="deposit-row"><span>'+money(v.amount)+' USDT · '+v.network+'<small>'+new Date(v.created_at*1000).toLocaleString()+'</small></span><b class="status-'+v.status.toLowerCase()+'">'+v.status+'</b></div>').join('')||'<div class="note">No deposits yet.</div>'}catch{}}window.copyDepositAddress=async()=>{let a=$('depositAddress').value;if(!a||a==='Not configured')return;try{await navigator.clipboard.writeText(a);$('depositMsg').textContent='Address copied.'}catch{$('depositMsg').textContent='Copy failed. Please copy the address manually.'}};window.submitDeposit=async()=>{let amount=Number($('depositAmount').value),network=$('depositNetwork').value,txid=$('depositTxid').value.trim(),file=$('depositReceipt').files[0];if(!depositSettings)return;$('depositMsg').textContent='Submitting...';if(!amount||amount<Number(depositSettings.minimumDeposit))return $('depositMsg').textContent='Minimum deposit is '+money(depositSettings.minimumDeposit)+' USDT';if(!txid)return $('depositMsg').textContent='Transaction ID / hash is required';let receiptData=null;if(file){if(file.size>500000)return $('depositMsg').textContent='Please use a receipt image under 500 KB';receiptData=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}try{let x=await fetch('/api/deposits',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,network,txid,receiptData})}),d=await x.json();if(!x.ok)return $('depositMsg').textContent=d.error||'Deposit could not be submitted';$('depositMsg').textContent='Deposit submitted successfully. Status: Pending';$('depositAmount').value='';$('depositTxid').value='';$('depositReceipt').value='';await loadDepositHistory()}catch{$('depositMsg').textContent='Network error. Please try again.'}};function render(p){p=norm(p);let q=P[p]||P['/'];$('title').textContent=q[0];$('desc').textContent=q[1];$('rounds').classList.toggle('show',p==='/rounds');$('wallet').classList.toggle('show',p==='/wallet');document.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('active',norm(b.dataset.r)===p));if(p==='/rounds')load(true);if(p==='/wallet')wallet()}document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{let p=norm(b.dataset.r);if(p!==norm(location.pathname))history.pushState({},'',p);render(p)});$('depositBtn').onclick=()=>{$('depositPanel').hidden=!$('depositPanel').hidden;if(!$('depositPanel').hidden){loadDepositSettings();loadDepositHistory()}};$('depositNetwork').addEventListener('change',updateDepositAddress);const clientShell=document.querySelector('.client-shell'),clientMenu=document.querySelector('.client-shell .mobile-menu');clientMenu?.addEventListener('click',()=>clientShell.classList.toggle('menu-open'));document.querySelectorAll('.client-shell [data-r]').forEach(b=>b.addEventListener('click',()=>clientShell.classList.remove('menu-open')));onpopstate=()=>{clientShell.classList.remove('menu-open');render(location.pathname)};render(location.pathname);fetch('/api/session',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.authenticated){$('auth').style.display='inline';if(norm(location.pathname)==='/'&&d.session?.fullName)$('title').textContent='Welcome, '+d.session.fullName}else $('cta').style.display='block'}).catch(()=>$('cta').style.display='block');if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));setInterval(()=>{if(norm(location.pathname)==='/rounds')load(false)},5000)})();
</script><script src="/withdrawal-ui.js"></script></body></html>
