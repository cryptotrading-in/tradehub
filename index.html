<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b12" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/nexus.svg" type="image/svg+xml" />
  <title>Tradehub</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .install-app-button{display:none;border:1px solid rgba(255,255,255,.12);background:rgba(124,108,255,.16);color:#f5f7fb;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
    .install-app-button.is-visible{display:inline-flex;align-items:center;justify-content:center}
    .install-app-button:active{transform:translateY(1px)}
    .auth-cta{display:none;flex-wrap:wrap;gap:10px;margin-top:20px}
    .auth-cta.is-visible{display:flex}
    .auth-cta a{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700}
    .auth-cta-primary{background:#7c6cff;color:#fff}.auth-cta-secondary{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#f5f7fb}
    .auth-user{display:none;margin-top:20px}
    .auth-user.is-visible{display:block}
    .auth-user strong{color:#f5f7fb}
  </style>
</head>
<body class="shell-page">
  <div class="app-shell client-shell">
    <aside class="sidebar" aria-label="Client navigation">
      <div class="brand">TRADE<span>HUB</span></div>
      <nav class="shell-nav">
        <button class="nav-item active" type="button" data-route="/">Home</button>
        <button class="nav-item" type="button" data-route="/rounds">Rounds</button>
        <button class="nav-item" type="button" data-route="/wallet">Wallet</button>
        <button class="nav-item" type="button" data-route="/account">Account</button>
      </nav>
    </aside>
    <div class="shell-main">
      <header class="topbar">
        <button class="mobile-menu" type="button" aria-label="Open menu">☰</button>
        <div><p class="eyebrow">TRADEHUB</p><h1>Premium trading workspace</h1></div>
        <div class="topbar-status"><button id="install-app-button" class="install-app-button" type="button" aria-label="Install Tradehub">Install</button><span class="status status-live">Ready</span></div>
      </header>
      <main class="shell-content">
        <section class="shell-hero glass-card">
          <span class="label">TRADEHUB</span>
          <h2 id="page-title">Your trading experience starts here.</h2>
          <p id="page-description">Trade smarter with a simple, secure workspace.</p>
          <div id="auth-cta" class="auth-cta">
            <a class="auth-cta-primary" href="/signup/">Create Account</a>
            <a class="auth-cta-secondary" href="/signin/">Sign In</a>
          </div>
          <p id="auth-user" class="auth-user">Welcome, <strong id="auth-user-name"></strong>.</p>
        </section>
      </main>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="nav-item active" type="button" data-route="/">Home</button>
        <button class="nav-item" type="button" data-route="/rounds">Rounds</button>
        <button class="nav-item" type="button" data-route="/wallet">Wallet</button>
        <button class="nav-item" type="button" data-route="/account">Account</button>
      </nav>
    </div>
  </div>
<script>
(() => {
  const pages = {
    '/': ['Your trading experience starts here.', 'Trade smarter with a simple, secure workspace.'],
    '/rounds': ['Trading rounds', 'Rounds workspace is ready for the next feature step.'],
    '/wallet': ['Wallet', 'Wallet workspace is ready for the next feature step.'],
    '/account': ['Account', 'Account workspace is ready for the next feature step.']
  };
  const normalize = path => {
    if (!path || path === '/index.html') return '/';
    if (path.length > 1 && path.endsWith('/')) return path.slice(0, -1);
    return path;
  };
  const render = (path, push = false) => {
    path = normalize(path);
    const page = pages[path] || pages['/'];
    if (!pages[path] && push) {
      history.replaceState({}, '', '/');
      path = '/';
    }
    document.getElementById('page-title').textContent = page[0];
    document.getElementById('page-description').textContent = page[1];
    document.querySelectorAll('[data-route]').forEach(button => {
      button.classList.toggle('active', normalize(button.dataset.route) === path);
    });
  };
  document.querySelectorAll('[data-route]').forEach(button => {
    button.addEventListener('click', () => {
      const path = normalize(button.dataset.route);
      if (path !== normalize(location.pathname)) history.pushState({}, '', path);
      render(path);
    });
  });
  window.addEventListener('popstate', () => render(location.pathname));
  render(location.pathname, true);

  const authCta = document.getElementById('auth-cta');
  const authUser = document.getElementById('auth-user');
  const authUserName = document.getElementById('auth-user-name');
  const pageTitle = document.getElementById('page-title');

  authCta.classList.remove('is-visible');
  authUser.classList.remove('is-visible');

  const loadSession = async () => {
    try {
      const response = await fetch('/api/session', { credentials: 'same-origin', cache: 'no-store' });
      const result = await response.json();
      if (response.ok && result.ok && result.authenticated) {
        const name = result.session?.fullName || result.session?.username;
        if (name) {
          authUserName.textContent = name;
          authUser.classList.add('is-visible');
          if (normalize(location.pathname) === '/') pageTitle.textContent = `Welcome, ${name}`;
        } else {
          authUser.classList.remove('is-visible');
          authCta.classList.add('is-visible');
        }
        authCta.classList.remove('is-visible');
      } else {
        authUser.classList.remove('is-visible');
        authCta.classList.add('is-visible');
      }
    } catch {
      authUser.classList.remove('is-visible');
      authCta.classList.add('is-visible');
    }
  };
  loadSession();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  const installButton = document.getElementById('install-app-button');
  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.classList.add('is-visible');
    window.dispatchEvent(new CustomEvent('tradehubinstallavailable'));
  });

  window.tradehubInstall = async () => {
    if (!deferredInstallPrompt) return false;
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installButton.classList.remove('is-visible');
    return choice.outcome === 'accepted';
  };

  installButton.addEventListener('click', () => window.tradehubInstall());

  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    installButton.classList.remove('is-visible');
  });
})();
</script>
</body>
</html>
