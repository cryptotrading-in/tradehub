<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tradehub</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="foundation-preview">
    <p class="eyebrow">TRADEHUB · DESIGN FOUNDATION</p>
    <h1>Premium round-based trading experience.</h1>
    <p class="intro">Design foundation only. No trading, wallet, authentication, or business logic has been added.</p>
    <section class="component-grid" aria-label="Design foundation components">
      <article class="glass-card"><span class="label">Primary action</span><button>Continue</button></article>
      <article class="glass-card"><span class="label">Status</span><span class="status status-live">Ready</span></article>
      <article class="glass-card"><span class="label">Input</span><input placeholder="Enter amount" /></article>
    </section>
  </main>
</body>
</html>
